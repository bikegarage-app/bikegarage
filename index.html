<title>BikeGarage</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{color-scheme:light dark;--bg:#f4f5f4;--card:#fff;--card2:#ecefec;--tx:#141614;--mu:#6b726b;--ac:#2e8b3d;--ln:#dfe3df;--ov:rgba(0,0,0,.45);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101110;--card:#1e1f1e;--card2:#2b2c2b;--tx:#f1f3f1;--mu:#9aa09a;--ac:#4caf50;--ln:#333;--ov:rgba(0,0,0,.65)}}
:root[data-theme="dark"]{--bg:#101110;--card:#1e1f1e;--card2:#2b2c2b;--tx:#f1f3f1;--mu:#9aa09a;--ln:#333;--ov:rgba(0,0,0,.65);color-scheme:dark}
:root[data-theme="light"]{color-scheme:light}
.sl{animation:inL .22s ease-out}.sr{animation:inR .22s ease-out}
@keyframes inL{from{opacity:0;transform:translateX(36px)}}@keyframes inR{from{opacity:0;transform:translateX(-36px)}}
.ico{vertical-align:-4px;margin-right:6px}.ic .ico{margin:0;vertical-align:middle}
.ricon{width:72px;height:72px;border-radius:50%;background:color-mix(in srgb,var(--ac) 18%,transparent);color:var(--ac);display:flex;align-items:center;justify-content:center;flex:none}
.sw{display:flex;flex-wrap:wrap;gap:12px}.swi{text-align:center;font-size:12px;color:var(--mu)}
.swb{display:block;width:44px;height:44px;border-radius:50%;border:3px solid var(--card);background:var(--c);box-shadow:0 0 0 1px var(--ln);cursor:pointer;margin:0 auto 4px}
.swb.sel{box-shadow:0 0 0 3px var(--tx)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:Roboto,system-ui,sans-serif}
html,body{touch-action:pan-y}body{overflow-x:hidden}
*{-webkit-tap-highlight-color:transparent}html{scrollbar-width:none}::-webkit-scrollbar{display:none}
body{-webkit-user-select:none;user-select:none}input,textarea,select{-webkit-user-select:text;user-select:text}
#wrap{width:100%;overflow-x:hidden;overflow-x:clip}
.peek{position:fixed;inset:0;transform:translateX(100%);will-change:transform;overflow:hidden;background:var(--bg);color:var(--tx);padding:calc(16px + env(safe-area-inset-top,0px)) 16px 110px;max-width:none;margin:0;z-index:1;pointer-events:none}
main{padding:16px 16px 110px;max-width:640px;margin:0 auto}
h1{font-size:26px;font-weight:500;margin:0}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:8px}
button,select,input{font:inherit;color:inherit}
.btn{background:var(--ac);color:var(--on,#fff);border:0;border-radius:10px;padding:10px 14px;font-weight:500;cursor:pointer}
.btn.sec{background:var(--card2);color:var(--tx)}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;margin-bottom:14px;overflow:hidden}
.pad{padding:14px 16px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.stats .card{margin:0;padding:14px}
.mu{color:var(--mu)}.big{font-size:30px;margin:6px 0}
.photo{position:relative;height:210px;background:#222 center/cover no-repeat}
.photo button{position:absolute;right:10px;bottom:10px;background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:8px 12px;cursor:pointer}
.photo .docb{left:10px;right:auto;padding:4px 8px;display:flex;align-items:center;color:var(--ac)}
.pbtn{display:inline-flex;align-items:center;gap:6px;background:var(--card2);color:var(--mu);border:1px solid var(--ln);border-radius:999px;padding:8px 16px;font-weight:500;cursor:pointer}
.pbtn .ico{margin:0;vertical-align:middle}.pbtn.on{background:var(--ac);color:var(--on,#fff);border-color:var(--ac)}
.photo .scb{left:66px}
.pb{height:8px;border-radius:99px;background:var(--card2);overflow:hidden;margin-top:4px}.pb i{display:block;height:100%;border-radius:99px}
.bdg{position:absolute;top:-7px;right:-9px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;color:#fff}
.ndot{position:absolute;top:-2px;right:-4px;width:9px;height:9px;border-radius:50%;background:#ef5350}
#splash{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:center;justify-content:center;animation:spOut .45s ease 1.9s forwards}
#splash svg{width:min(82vw,440px);height:auto;fill:var(--ac)}
.lg1{animation:lgIn .8s cubic-bezier(.2,.8,.2,1) .1s both;transform-origin:50% 50%;transform-box:fill-box}
.lg2{animation:lgUp .6s ease .65s both}
@keyframes lgIn{from{opacity:0;transform:translateY(18px) scale(.92)}to{opacity:1;transform:none}}
@keyframes lgUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes spOut{to{opacity:0;visibility:hidden}}
@media (prefers-reduced-motion:reduce){.lg1,.lg2{animation:none}#splash{animation-delay:.6s}}
.chip{display:inline-block;background:var(--card2);color:var(--mu);border-radius:999px;padding:3px 12px;font-size:14px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.name{font-size:24px;font-weight:500}
hr{border:0;border-top:1px solid var(--ln);margin:10px 0}
.green{color:var(--ac)}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));background:var(--card);border:1px solid var(--ln);border-radius:30px;display:flex;padding:6px;gap:4px;z-index:5}
nav button{background:none;border:0;border-radius:24px;padding:8px 6px;color:var(--mu);font-size:11px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{display:flex}
nav button.on{background:color-mix(in srgb,var(--ac) 25%,transparent);color:var(--ac)}
.seg{display:flex;background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:4px;margin-bottom:14px;gap:2px}
.seg button{flex:1;border:0;background:none;padding:9px;border-radius:9px;color:var(--mu);cursor:pointer}
.seg button.on{background:var(--card2);color:var(--tx)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;background:var(--card2);border-radius:12px;padding:14px;margin:10px 0}
.grid small{display:block;color:var(--mu);font-size:12px;text-transform:uppercase;letter-spacing:.3px}
.grid b{font-size:20px;font-weight:500}
.ic{background:none;border:0;font-size:20px;cursor:pointer;color:var(--mu)}
.tag{border-radius:999px;padding:5px 14px;font-size:14px;background:var(--card2);color:var(--mu);white-space:nowrap}
.tag[style]{background:color-mix(in srgb,var(--tc) 20%,transparent);color:color-mix(in srgb,var(--tc) 72%,var(--tx));font-weight:500}
.item{padding:14px 16px;border-bottom:1px solid var(--ln)}.item:last-child{border:0}
.yrh{display:flex;justify-content:space-between;align-items:baseline;margin:24px 2px 14px}.yrh h2{margin:0;font-size:34px;font-weight:600}
.tl{position:relative;padding-left:34px}
.tli{position:relative;margin-bottom:14px}
.tli::before{content:"";position:absolute;left:-25px;top:32px;bottom:-34px;width:2px;background:var(--ln)}
.tli:last-child{margin-bottom:0}.tli:last-child::before{display:none}
.dot{position:absolute;left:-34px;top:20px;width:20px;height:20px;border-radius:50%;border:2px solid var(--tc);background:color-mix(in srgb,var(--tc) 30%,var(--bg));display:flex;align-items:center;justify-content:center;z-index:1}
.dot::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--tc)}
.tlc{border-radius:22px;margin:0}
.lnk{background:none;border:0;font-weight:600;padding:8px 0;margin-right:22px;cursor:pointer;font-size:15px}
.ov{position:fixed;inset:0;background:var(--ov);display:none;align-items:flex-end;justify-content:center;z-index:20}
.ov.show{display:flex}
.sheet{background:var(--card);width:100%;max-width:640px;max-height:90%;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet h2{margin:0 0 12px;font-weight:500}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}
.sheet input,.sheet select,.top select{width:100%;background:var(--card2);border:1px solid var(--ln);border-radius:10px;padding:11px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.empty{text-align:center;color:var(--mu);padding:30px}
</style>
</head>

function render(){

  .map(([k,i,l])=>`<button class="${tab==k?'on':''}" onclick="tab='${k}';render()"><span style="position:relative">${IC[k]}${k==='dati'&&UPD.s==='new'?'<i class="ndot"></i>':''}</span>${l}</button>`).join('');

function garage(){
 return `<div class="top"><h1>${garageTitle()}</h1><div style="display:flex;gap:8px;align-items:center"><button class="btn sec" style="padding:9px 11px;display:flex;align-items:center" aria-label="Guida" onclick="guida(0)">${I.help}</button><button class="btn" onclick="formBici()">+ Nuova bici</button></div></div>
 <div class="stats"><div class="card"><div class="mu">Bici in garage</div><div class="big">${S.bici.length}</div><div class="mu">Valore ${eur(S.bici.reduce((a,b)=>a+(+b.prezzo||0),0))}</div></div>
 <div class="card"><div class="mu">Interventi totali</div><div class="big">${S.interventi.length}</div><div class="mu">${eur(S.interventi.reduce((a,i)=>a+(+i.costo||0),0))} spesi</div></div></div>`+
 (S.bici.map(b=>`<div class="card"><div class="photo" style="${b.foto?`background-image:url(${b.foto})`:''}">
  <button class="docb" onclick="docsList(${b.id})" aria-label="Documenti">${DOCI(S.docs.filter(d=>d.bici==b.id).length)}</button>${scBtn(b.id)}<button aria-label="Cambia foto" onclick="foto(${b.id})">${I.cam}</button></div><div class="pad" onclick="formBici(${b.id})">
  <div class="row"><span><span class="chip">${esc(b.tipo)}</span>${b.sosp?` <span class="chip">${esc(b.sosp)}</span>`:''} <span class="chip">${esc(b.stato||'Nuova')}</span></span><span class="mu">${b.anno||''}</span></div>
  <div class="mu" style="margin-top:8px;text-transform:uppercase">${esc(b.marca)}</div><div class="name">${esc(b.modello)}</div><hr>
  <div class="row"><span class="mu">Taglia <b style="color:var(--tx)">${esc(b.taglia)}</b> &nbsp; Colore <b style="color:var(--tx)">${esc(b.colore)}</b></span><span><b>${ult(b).km}</b> km</span></div>
  ${b.prezzo!==''&&b.prezzo!=null?`<div class="mu" style="margin-top:8px">Prezzo di acquisto ${eur(b.prezzo)}</div>`:''}
  ${b.dataAcq?`<div class="mu" style="margin-top:6px">Acquistata il ${dt(b.dataAcq)}</div>`:''}
  
  
  ${(ult(b).batteria!==''||(isE(b.tipo)&&ult(b).cicli!==''))?`<div class="green" style="margin-top:8px;display:flex;flex-wrap:wrap;gap:2px 16px">${ult(b).batteria!==''?`<span>Stato batteria ${ult(b).batteria}%</span>`:''}${isE(b.tipo)&&ult(b).cicli!==''?`<span>Cicli di ricarica ${ult(b).cicli}</span>`:''}</div>`:''}</div></div>`).join('')||'<div class="empty"><div style="font-size:20px;color:var(--tx);margin-bottom:8px">Benvenuto in BikeGarage</div>Tocca <b>+ Nuova bici</b> per aggiungere la prima bici. Poi registra manutenzioni, setup e geometrie, e crea la scheda storica in PDF dalla sezione Dati.</div>');
}
function officina(){
 const l=S.interventi.filter(i=>filtro=='tutte'||i.bici==filtro).sort((a,b)=>(b.data||'').localeCompare(a.data||'')||b.id-a.id);
 const gr=new Map();l.forEach(i=>{const y=(i.data||'').slice(0,4)||'Senza data';if(!gr.has(y))gr.set(y,[]);gr.get(y).push(i)});
 return `<div class="top"><h1>Registro manutenzione</h1><button class="btn" onclick="formInt()">+ Aggiungi</button></div>
 <select style="width:100%;background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:14px;margin-bottom:6px" onchange="filtro=this.value;render()">
 <option value="tutte">Tutte le bici</option>${S.bici.map(b=>`<option value="${b.id}" ${filtro==b.id?'selected':''}>${esc(b.marca+' '+b.modello)}</option>`).join('')}</select>`+
 ([...gr].map(([y,a])=>`<div class="yrh"><h2>${y}</h2><span class="mu">${a.length} ${a.length==1?'intervento':'interventi'}</span></div><div class="tl">${a.map(i=>{const c=TCOL[i.tipo]||'#9e9e9e';return `<div class="tli" style="--tc:${c}"><span class="dot"></span><div class="card pad tlc">
 <div class="row"><span class="tag" style="--tc:${c}">${esc(i.tipo)}</span><span class="mu">${dt(i.data)}</span></div>

 <div class="mu">${i.km} km${i.costo?' \u00b7 '+eur(i.costo):''}${i.batteria!==''&&i.batteria!=null?' \u00b7 '+I.batt+i.batteria+'%':''}${i.cicli!==''&&i.cicli!=null?' \u00b7 '+i.cicli+' cicli':''}</div>${i.note?`<div style="margin-top:6px">${esc(i.note)}</div>`:''}
